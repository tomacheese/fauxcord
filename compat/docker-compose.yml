name: fauxcord-compat

services:
  fauxcord:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DISABLE_AUTH: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/_mock/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- Mechanism A: JS/TS verifiers (light images, run in default CI) ---

  verify-discordjs:
    build:
      context: .
      dockerfile: ./js-discordjs/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  verify-eris:
    build:
      context: .
      dockerfile: ./js-eris/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  verify-oceanic:
    build:
      context: .
      dockerfile: ./js-oceanic/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  # --- Mechanism B: other-language verifiers (heavier images, added incrementally) ---

  verify-discordgo:
    build:
      context: .
      dockerfile: ./go-discordgo/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10/"
    volumes:
      - ./results:/results

  verify-discordnet:
    build:
      context: .
      dockerfile: ./dotnet-discordnet/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10/"
    volumes:
      - ./results:/results

  verify-serenity:
    build:
      context: .
      dockerfile: ./rust-serenity/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10/"
    volumes:
      - ./results:/results

  verify-hikari:
    build:
      context: .
      dockerfile: ./python-hikari/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  verify-discordpy:
    build:
      context: .
      dockerfile: ./python-discordpy/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  verify-nextcord:
    build:
      context: .
      dockerfile: ./python-nextcord/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  verify-pycord:
    build:
      context: .
      dockerfile: ./python-pycord/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  verify-interactions:
    build:
      context: .
      dockerfile: ./python-interactions/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  verify-discord4j:
    build:
      context: .
      dockerfile: ./jvm-discord4j/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  verify-kord:
    build:
      context: .
      dockerfile: ./jvm-kord/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

  verify-twilight:
    build:
      context: .
      dockerfile: ./rust-twilight/Dockerfile
    depends_on:
      fauxcord:
        condition: service_healthy
    environment:
      FAUXCORD_BASE: "http://fauxcord:3000/api/v10"
    volumes:
      - ./results:/results

# Verifier services for the remaining languages (JVM (JDA is documented as
# blocked; Discord4J/Javacord/Kord not yet scaffolded) / C / C++, plus Rust's
# second library Twilight, and Python's interactions.py) are added
# incrementally per the plan. Each follows the same shape:
#
#   verify-<lib>:
#     build: { context: ., dockerfile: ./<lang>-<lib>/Dockerfile }
#     depends_on: { fauxcord: { condition: service_healthy } }
#     environment: { FAUXCORD_BASE: "http://fauxcord:3000/api/v10" }
#     volumes: [ "./results:/results" ]
