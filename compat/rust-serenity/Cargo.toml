[package]
name = "serenity-verify"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Pinned to the 0.12 major line (the current stable major as of this writing).
# `default-features = false` + an explicit minimal feature set keeps this an
# HTTP-only build with no gateway/voice/cache/model-impl bloat.
#
# CONFIDENCE NOTE: the feature *names* below ("http", "rustls_backend") are
# based on training-data knowledge of serenity's Cargo feature flags, not a
# live docs.rs/crates.io lookup (network access is disallowed in this build
# environment, so this could not be verified against the exact 0.12.x patch
# that `cargo fetch` will resolve to). If `cargo build` reports an unknown
# feature, or a missing type/method because some model types are gated behind
# a separate "model" feature in this exact release, add the missing feature
# name rather than assuming serenity is unusable here.
#
# CONFIRMED VIA `cargo build` (0.12.5): "http" alone fails to compile --
# serenity's own `http/client.rs` and `http/multipart.rs` unconditionally
# `use crate::builder::{...}`, so `builder` must be enabled too even though
# this file never calls the `CreateXxx` builder types directly (every call
# here uses a raw `serde_json::Map` body).
#
# `client`/`gateway`/`model` added for the Gateway verification phase below:
# `Client::builder`/`EventHandler`/`Ready`/`Message` all live behind them.
serenity = { version = "0.12", default-features = false, features = [
  "http",
  "builder",
  "rustls_backend",
  "client",
  "gateway",
  "model",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# serenity 0.12 exposes `Webhook.token` as `Option<secrecy::SecretString>` and
# does NOT publicly re-export `secrecy`, so extracting the raw token string
# (needed to drive the token-authenticated webhook endpoints below) requires
# the `ExposeSecret` trait directly.
#
# FIX: must stay pinned to the exact 0.8 line serenity 0.12.5 itself resolves
# internally — a stale "0.10" here (already present before this task) put two
# distinct `secrecy` majors in the dependency graph, so the `ExposeSecret`
# impl this file imports (0.10's) didn't match the trait `Webhook.token`
# (0.8's `Secret<String>`) actually implements, and `cargo build` rejected
# `.expose_secret()` as "method not found".
secrecy = "0.8"
# Used directly for the health-check poll and the /_test/setup POST (the same
# role fetch() plays in the JS verifiers) — kept independent of whatever
# internal HTTP client serenity's "http" feature pulls in. `rustls-tls`
# matches serenity's own rustls_backend choice so the image doesn't need
# OpenSSL.
#
# FIX: must stay pinned to the exact 0.12 line serenity 0.12.5 resolves
# internally — a stale "0.13" here (already present before this task, using
# the 0.13-only "rustls" feature name) put two distinct `reqwest` majors in
# the dependency graph, so the `reqwest::Client` this file builds and passes
# to `HttpBuilder::client()` (0.13's type) didn't match the type that method
# actually expects (serenity's own 0.12 `reqwest::Client`), and `cargo build`
# rejected it as a type mismatch.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
