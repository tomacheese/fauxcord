services:
  discord-mock:
    build: .
    # Or pull from ghcr.io:
    # image: ghcr.io/tomacheese/fauxcord:latest
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_PATH: /data/mock.db
      UPLOAD_PATH: /data/uploads
      # BASE_URL is used to generate URLs embedded in responses (e.g. attachment URLs).
      # Defaults to localhost assuming clients run on the host machine.
      # Change to a URL reachable by the client if accessing from another container or external host.
      BASE_URL: http://localhost:3000
      LOG_LEVEL: info
      DISABLE_AUTH: "false"
      LATENCY_MS: "0"
      # SEED_FILE: /config/seed.json
    volumes:
      # Volume for persisting the SQLite database and uploaded files
      - discord-mock-data:/data
      # To seed initial data at startup, uncomment the line below
      # and also enable SEED_FILE in the environment section above.
      # See seed.example.json for the seed file format.
      # - ./seed.json:/config/seed.json:ro
    healthcheck:
      # Use 127.0.0.1 explicitly: busybox wget on Alpine resolves localhost to ::1 (IPv6)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/_mock/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Set slightly longer to account for startup time
      start_period: 15s
    restart: unless-stopped

  # Development service: watches source files and auto-restarts (tsx watch)
  # Usage: docker compose --profile dev up discord-mock-dev
  discord-mock-dev:
    profiles:
      - dev
    build:
      context: .
      # The builder stage includes devDependencies (tsx, etc.)
      target: builder
    command: ["node_modules/.bin/tsx", "watch", "src/index.ts"]
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_PATH: /data/mock.db
      UPLOAD_PATH: /data/uploads
      BASE_URL: http://localhost:3000
      LOG_LEVEL: debug
      DISABLE_AUTH: "false"
      LATENCY_MS: "0"
    volumes:
      # Mount host source code for hot-reload
      - ./src:/app/src
      - discord-mock-data:/data

volumes:
  discord-mock-data:
