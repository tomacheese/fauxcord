# Dependencies allowed to run build scripts during pnpm install
# better-sqlite3: required to compile the native module
# esbuild: required to run the binary placement script (used by vitest / tsx)
allowBuilds:
  better-sqlite3: true
  esbuild: true
# @book000/*: Renovate 側で stabilityDays チェックから除外されているスコープのため、
# pnpm 側の minimumReleaseAge チェックからも除外し、公開直後の Docker CI 失敗を防ぐ
minimumReleaseAgeExclude:
  - '@book000/*'
