# Build and test with Node.js. The version is read from .node-version.

name: Node CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  node-ci:
    name: Node CI
    uses: book000/templates/.github/workflows/reusable-nodejs-ci-pnpm.yml@6b1a03112ee32f6c00cc934eb486fcea36dfe5e9 # master
    with:
      install-apt-packages: python3 make g++
