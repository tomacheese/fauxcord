# Build and test with Node.js. The version is read from .node-version.

name: Node CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  node-ci:
    name: Node CI
    uses: book000/templates/.github/workflows/reusable-nodejs-ci-pnpm.yml@e87b0732e45ca1ef33e1448ce85ad2eee8c5f648 # master
    with:
      install-apt-packages: python3 make g++
