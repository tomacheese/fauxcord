# Build and test with Node.js. The version is read from .node-version.

name: Node CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  node-ci:
    name: Node CI
    uses: book000/templates/.github/workflows/reusable-nodejs-ci-pnpm.yml@1f725b61fe3b897dde4fc3c02d8f9496d3cdb428 # master
    with:
      install-apt-packages: python3 make g++
